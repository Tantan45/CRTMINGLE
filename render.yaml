services:
  - type: web
    name: crtmingle
    runtime: node
    plan: starter
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /health
    autoDeploy: true
    disk:
      name: crtmingle-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: TRUST_PROXY
        value: "true"
      - key: DATABASE_PATH
        value: /var/data/crtmingle.sqlite
      - key: CHAT_TIMEZONE
        value: Asia/Manila
      - key: CHAT_OPEN_HOUR
        value: "15"
      - key: CHAT_CLOSE_HOUR
        value: "21"
      - key: REPORT_LIMIT
        value: "3"
      - key: REPORT_WINDOW_HOURS
        value: "24"
      - key: SESSION_SECRET
        sync: false
      - key: FINGERPRINT_SECRET
        sync: false
      - key: ADMIN_ACCESS_CODE_HASH
        sync: false
      - key: COUNSELOR_CONTACT
        sync: false
      - key: CRISIS_RESOURCE
        value: Philippines NCMH Crisis Hotline: 1553
